server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing (react-router) — fall back to index.html for any
    # path that isn't a real static asset.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # Same-origin API access: proxy to the backend service so the frontend
    # build can use a relative VITE_API_BASE_URL (e.g. /api/v1) instead of
    # hardcoding a backend hostname/port. Resolved against Docker's embedded
    # DNS at request time (not just container startup) via the variable
    # form of proxy_pass, so nginx doesn't fail if the backend isn't up yet
    # when nginx itself starts.
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
